# /etc/nginx/sites-available/mongolflix
# /srv/mongolflix нь .env-ийн VIDEO_DEFAULT_ROOT-тэй ижил байх ёстой.
# Нууц толгой: /etc/nginx/snippets/mongolflix-internal.conf (docs/DEPLOYMENT.md). Энд бичихгүй.
limit_req_zone $binary_remote_addr zone=mongolflix_hls:10m rate=60r/s;
proxy_cache_path /var/cache/nginx/mongolflix_auth levels=1:2 keys_zone=mongolflix_auth:10m max_size=64m inactive=2m use_temp_path=off;

upstream mongolflix_api { server 127.0.0.1:4100; keepalive 16; }
upstream mongolflix_web { server 127.0.0.1:3100; keepalive 16; }

server {
  listen 80;
  # HTTPS-ийг certbot --nginx нэмнэ (docs/DEPLOYMENT.md). Серверийн бусад сайтад нөлөөлөхгүйн тулд
  # default_server биш, зөвхөн энэ нэрээр хариулна.
  server_name zzzcinema.mn;
  client_max_body_size 25g;
  add_header X-Content-Type-Options nosniff always;

  # Дотоод зам: гаднаас хэзээ ч нэвтрэхгүй.
  location /internal/ { return 404; }

  # Хамгаалалттай HLS: хүсэлт бүрийг auth_request-ээр шалгаад шууд дискнээс өгнө.
  # /v/<токен>/<киноны id>/<файл>. Токен лог-д бичигдэхгүй.
  # `{24}` агуулсан тул regex заавал хашилтад байна: үгүй бол Nginx эхлэхгүй.
  location ~ "^/v/[^/]+/(?<movie>[a-f0-9]{24})/(?<hlsfile>master\.m3u8|[0-9]+p/index\.m3u8|[0-9]+p/seg_[0-9]+\.ts)$" {
    access_log off;
    limit_req zone=mongolflix_hls burst=120 nodelay;
    auth_request /_stream_auth;
    alias /srv/mongolflix/hls/$movie/$hlsfile;
    types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
    add_header Cache-Control "private, no-store" always;
  }
  # Дээрх regex-т таараагүй /v/ бүгд 404. `^~` хэрэглэж болохгүй: тэр нь regex шалгалтыг алгасдаг.
  location /v/ { return 404; }

  location = /_stream_auth {
    internal;
    proxy_pass http://mongolflix_api/internal/stream/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    include /etc/nginx/snippets/mongolflix-internal.conf;
    # Сегмент бүрт бааз дуудахгүйн тулд ижил токены шийдвэрийг богино хугацаанд кэшлэнэ.
    proxy_cache mongolflix_auth;
    proxy_cache_key "$movie:$request_uri";
    proxy_cache_valid 204 15s;
    proxy_cache_valid 403 5s;
  }

  # Постер, арын зураг нийтэд ил. originals/, hls/, temp/ хэзээ ч шууд гарахгүй.
  location /media/posters/ { alias /srv/mongolflix/posters/; expires 7d; }
  location /media/backdrops/ { alias /srv/mongolflix/backdrops/; expires 7d; }

  location /api/ {
    proxy_pass http://mongolflix_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://mongolflix_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# www-г үндсэн домэйн рүү чиглүүлнэ.
server {
  listen 80;
  server_name www.zzzcinema.mn;
  return 301 https://zzzcinema.mn$request_uri;
}
